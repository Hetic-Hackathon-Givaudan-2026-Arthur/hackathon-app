openapi: 3.0.3

info:
  title: Givaudan Hackathon groupe 2
  version: 0.1.0
  description: >
    Contrat initial de l'API du projet .
    Les fonctionnalités métier seront définies ultérieurement
    avec l'équipe Data/IA.

x-websocket-endpoints:
  /ws/analyse:
    description: Reçoit les segments de transcription et émet les résultats corrélés.
    input: TranscriptMessage
    error: WebSocketError
    outputs:
      - AnalysisResult
      - VisualResult

paths:
  /health:
    get:
      summary: Vérifier l'état du service
      description: Retourne l'état de disponibilité du service.
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: Le service est opérationnel.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
              example:
                status: ok

components:
  schemas:
    TranscriptMessage:
      type: object
      additionalProperties: false
      required:
        - type
        - text
        - isFinal
        - sessionId
        - segmentId
      properties:
        type:
          type: string
          enum: [transcript]
        text:
          type: string
          minLength: 1
        isFinal:
          type: boolean
        sessionId:
          type: string
          minLength: 1
        segmentId:
          type: string
          minLength: 1
    WebSocketError:
      type: object
      required: [event, code, message]
      properties:
        event:
          type: string
          enum: [error]
        code:
          type: string
          enum: [invalid_json, invalid_segment]
        message:
          type: string
    AnalysisResult:
      type: object
      required: [event, session_id, analysis]
      properties:
        event:
          type: string
          enum: [analysis_result]
        session_id:
          type: string
        analysis:
          type: object
          required: [analysis_id, text]
          properties:
            analysis_id:
              type: string
            text:
              type: object
              required: [idea, details]
              properties:
                idea:
                  type: string
                details:
                  type: array
                  items:
                    type: string
    VisualResult:
      type: object
      required: [event, session_id, analysis]
      properties:
        event:
          type: string
          enum: [visual_result]
        session_id:
          type: string
        analysis:
          type: object
          required: [analysis_id, images]
          properties:
            analysis_id:
              type: string
            images:
              type: array
              items:
                type: object
                required: [image_id, content_type, byte_length]
                properties:
                  image_id:
                    type: string
                  content_type:
                    type: string
                  byte_length:
                    type: integer
                    minimum: 0
