name: accordel

services:
  web:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    command: >
      sh -c "npm ci &&
             npm run dev -w web -- --host 0.0.0.0"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    ports:
      - '5173:5173'
    depends_on:
      - backend
      - ai-ws

  backend:
    env_file:
      - .env
    environment:
      PYTHONPATH: /workspace/backend
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-mimo-v2.6}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
      LLM2_MODEL: ${LLM2_MODEL:-qwen2.5:1.5b}
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /workspace
    command: >
      uvicorn backend.entrypoints.http_api:app
      --host 0.0.0.0
      --port 8000
      --reload
    volumes:
      - ./backend:/workspace/backend
    ports:
      - '8000:8000'

  ai-ws:
    env_file:
      - .env
    environment:
      PYTHONPATH: /workspace/backend
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-mimo-v2.6}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
      LLM2_MODEL: ${LLM2_MODEL:-qwen2.5:1.5b}
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /workspace
    command: >
      uvicorn backend.entrypoints.websocket_api:app
      --host 0.0.0.0
      --port 8001
      --reload
    volumes:
      - ./backend:/workspace/backend
    ports:
      - '8001:8001'

volumes:
  node_modules:
