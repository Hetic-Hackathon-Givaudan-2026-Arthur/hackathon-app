name: accordel

services:
  web:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    command: >
      sh -c "npm ci &&
             npm run dev -w web -- --host 0.0.0.0"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    ports:
      - '5173:5173'
    depends_on:
      - backend
      - ai-ws

  backend:
    environment:
      PYTHONPATH: /workspace/backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /workspace
    command: >
      uvicorn backend.entrypoints.http_api:app
      --host 0.0.0.0
      --port 8000
      --reload
    volumes:
      - ./backend:/workspace/backend
    ports:
      - '8000:8000'

  ai-ws:
    environment:
      PYTHONPATH: /workspace/backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /workspace
    command: >
      uvicorn backend.entrypoints.websocket_api:app
      --host 0.0.0.0
      --port 8001
      --reload
    volumes:
      - ./backend:/workspace/backend
    ports:
      - '8001:8001'

volumes:
  node_modules:
